<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1e3a8a">
  <title>Daksh Quants Maths Book | Practice Hub</title>
  <link rel="preconnect" href="https://drive.google.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
      background: #e2e8f0;
      color: #0f172a;
      font-family: "Outfit", system-ui, sans-serif;
    }
    .reader-header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 16px;
      background: linear-gradient(135deg, #172554, #1e3a8a);
      color: #fff;
      box-shadow: 0 4px 16px rgba(15, 23, 42, .25);
      z-index: 1;
    }
    .back, .drive-link {
      border: 1px solid rgba(255,255,255,.28);
      border-radius: 9px;
      padding: 9px 13px;
      color: #fff;
      background: rgba(255,255,255,.12);
      text-decoration: none;
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }
    .back:hover, .drive-link:hover { background: rgba(255,255,255,.22); }
    .title { min-width: 0; flex: 1; }
    h1 { margin: 0; font-size: clamp(16px, 2.4vw, 22px); }
    .subtitle { margin: 3px 0 0; color: #bfdbfe; font-size: 11px; }
    .reader {
      flex: 1;
      width: 100%;
      min-height: 0;
      border: 0;
      background: #fff;
    }
    .notice {
      margin: 0;
      padding: 7px 16px;
      background: #fef3c7;
      color: #78350f;
      text-align: center;
      font-size: 11px;
    }
    @media (max-width: 620px) {
      .reader-header { gap: 9px; padding: 10px; }
      .back, .drive-link { padding: 8px 10px; font-size: 0; }
      .back::after { content: "←"; font-size: 18px; }
      .drive-link::after { content: "Drive ↗"; font-size: 12px; }
      .subtitle { display: none; }
    }
  </style>
</head>
<body>
  <header class="reader-header">
    <a class="back" href="index.html" aria-label="Back to dashboard">&larr; Dashboard</a>
    <div class="title">
      <h1>📘 Daksh Quants Maths Book</h1>
      <p class="subtitle">Google Drive embedded reader</p>
    </div>
    <a class="drive-link" href="https://drive.google.com/file/d/1AvTly-LeVyD6Gsoxpgnqnkz0zXMT5u8s/view" target="_blank" rel="noopener noreferrer">Open in Drive ↗</a>
  </header>
  <p class="notice">If the book does not appear, confirm that the Drive file is shared with viewers, then use “Open in Drive”.</p>
  <iframe
    class="reader"
    src="https://drive.google.com/file/d/1AvTly-LeVyD6Gsoxpgnqnkz0zXMT5u8s/preview"
    title="Daksh Quants Maths Book"
    allow="autoplay"
    allowfullscreen
  ></iframe>
</body>
</html>
